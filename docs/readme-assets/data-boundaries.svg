<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="505" viewBox="0 0 1000 505" role="img" aria-labelledby="title desc">
<title id="title">Local reports, explicit network boundaries</title><desc id="desc">Saved exports are processed locally with a working cache. Online cache misses may send an OUI prefix to MACVendors or MACLookup; offline mode blocks that lookup. Opening HTML independently loads Plotly from a CDN. CSV and text reports need no browser script.</desc>
<rect x="0" y="0" width="1000" height="505" rx="16" fill="#131e26" stroke="#131e26"/>
<text x="28" y="38" fill="#d9bd8e" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="1.5">FOLLOW THE DATA</text>
<rect x="24" y="65" width="952" height="194" rx="12" fill="#1e2d36" stroke="#354953"/>
<text x="44" y="96" fill="#b9dcd6" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1.4">ON YOUR MACHINE</text>
<text x="48" y="135" fill="#d9bd8e" font-family="Arial, Helvetica, sans-serif" font-size="16" >01</text>
<text x="48" y="174" fill="#f7f3e9" font-family="Georgia, Times New Roman, serif" font-size="29" >Saved export</text>
<text x="48" y="215" fill="#bfccd3" font-family="Arial, Helvetica, sans-serif" font-size="19" >MAC / ARP text</text>
<text x="350" y="135" fill="#d9bd8e" font-family="Arial, Helvetica, sans-serif" font-size="16" >02</text>
<text x="350" y="174" fill="#f7f3e9" font-family="Georgia, Times New Roman, serif" font-size="29" >Vendor lookup</text>
<text x="350" y="215" fill="#bfccd3" font-family="Arial, Helvetica, sans-serif" font-size="19" >Working OUI cache</text>
<text x="682" y="135" fill="#d9bd8e" font-family="Arial, Helvetica, sans-serif" font-size="16" >03</text>
<text x="682" y="174" fill="#f7f3e9" font-family="Georgia, Times New Roman, serif" font-size="29" >Local reports</text>
<text x="682" y="215" fill="#bfccd3" font-family="Arial, Helvetica, sans-serif" font-size="19" >CSV · text · HTML</text>
<path d="M230 163L316 163" fill="none" stroke="#b9dcd6" stroke-width="2"/><path d="M309 157l7 6-7 6" fill="none" stroke="#b9dcd6" stroke-width="2"/>
<path d="M558 163L648 163" fill="none" stroke="#b9dcd6" stroke-width="2"/><path d="M641 157l7 6-7 6" fill="none" stroke="#b9dcd6" stroke-width="2"/>
