<path d="M478 306L478 330" fill="none" stroke="#d9bd8e" stroke-width="2" stroke-dasharray="6 6"/><path d="M472 323l6 7 6-7" fill="none" stroke="#d9bd8e" stroke-width="2"/>
<text x="478" y="294" fill="#d9bd8e" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">Online cache miss: OUI only</text>
<rect x="270" y="332" width="366" height="118" rx="12" fill="#1e2d36" stroke="#354953"/>
<text x="290" y="369" fill="#f7f3e9" font-family="Georgia, Times New Roman, serif" font-size="23" >MACVendors / MACLookup</text>
<text x="290" y="412" fill="#bfccd3" font-family="Arial, Helvetica, sans-serif" font-size="18" >--offline blocks this lookup.</text>
<path d="M822 235L822 272" fill="none" stroke="#d9bd8e" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M822 306L822 330" fill="none" stroke="#d9bd8e" stroke-width="2" stroke-dasharray="6 6"/><path d="M816 323l6 7 6-7" fill="none" stroke="#d9bd8e" stroke-width="2"/>
<text x="822" y="294" fill="#d9bd8e" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">Open HTML: script request</text>
<rect x="654" y="332" width="322" height="118" rx="12" fill="#1e2d36" stroke="#354953"/>
<text x="674" y="369" fill="#f7f3e9" font-family="Georgia, Times New Roman, serif" font-size="26" >Plotly CDN</text>
<text x="674" y="412" fill="#bfccd3" font-family="Arial, Helvetica, sans-serif" font-size="18" >Browser loads chart code.</text>
<text x="28" y="483" fill="#bfccd3" font-family="Arial, Helvetica, sans-serif" font-size="18" >CSV and text reports remain readable without the browser’s Plotly dependency.</text>
